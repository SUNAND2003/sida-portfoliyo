<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="36" fill="#FFFFFF"/>
  <g transform="translate(150, 90)">
    <!-- Modern Geometric Golf Flag Monogram -->
    <polygon points="100,10 190,70 100,120" fill="#18181B"/>
    <line x1="100" y1="10" x2="100" y2="180" stroke="#18181B" stroke-width="12" stroke-linecap="round"/>
    <!-- Speed Lines -->
    <line x1="20" y1="140" x2="80" y2="140" stroke="#DC2626" stroke-width="8" stroke-linecap="round"/>
    <line x1="40" y1="160" x2="80" y2="160" stroke="#DC2626" stroke-width="8" stroke-linecap="round"/>
    <circle cx="100" cy="180" r="10" fill="#DC2626"/>
  </g>
  <text x="250" y="340" font-family="'Anton', sans-serif" font-style="italic" font-size="40" fill="#18181B" text-anchor="middle" letter-spacing="2">GOLF LAB</text>
  <text x="250" y="375" font-family="'DM Sans', sans-serif" font-weight="800" font-size="13" fill="#DC2626" text-anchor="middle" letter-spacing="6">HIGH PERFORMANCE</text>
</svg>