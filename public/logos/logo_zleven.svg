<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="36" fill="#FFFFFF"/>
  <g transform="translate(130, 90)">
    <!-- '24' badge -->
    <rect x="0" y="50" width="60" height="110" rx="8" fill="#1E40AF"/>
    <text x="30" y="125" font-family="'Anton', sans-serif" font-size="52" fill="#FACC15" text-anchor="middle">24</text>
    <!-- Geometric 'Z' Ribbon -->
    <polygon points="75,50 240,50 160,110 240,160 75,160 145,110" fill="#2563EB"/>
    <polygon points="75,50 145,110 75,160" fill="#1D4ED8"/>
    <polygon points="160,110 240,50 240,160" fill="#3B82F6"/>
    <!-- Yellow Dart -->
    <polygon points="210,50 240,50 240,80" fill="#FACC15"/>
  </g>
  <text x="250" y="340" font-family="'Anton', sans-serif" font-size="44" fill="#1E3A8A" text-anchor="middle" letter-spacing="4">ZLEVEN</text>
  <text x="250" y="375" font-family="'DM Sans', sans-serif" font-weight="700" font-size="16" fill="#64748B" text-anchor="middle" letter-spacing="8">M E D I A</text>
</svg>