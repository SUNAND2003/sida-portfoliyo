<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="36" fill="#FFFFFF"/>
  <g transform="translate(150, 100)">
    <!-- Interlocking G Architectural Monogram -->
    <path d="M 160,40 L 40,40 L 40,180 L 160,180 L 160,110 L 100,110" fill="none" stroke="#1E293B" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Golden Geometric Accent Gable -->
    <path d="M 20,40 L 100,-20 L 180,40" fill="none" stroke="#D4A359" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
    <circle cx="100" cy="110" r="10" fill="#D4A359"/>
  </g>
  <text x="250" y="360" font-family="'DM Sans', sans-serif" font-weight="700" font-size="28" fill="#0F172A" text-anchor="middle" letter-spacing="8">GUILD &amp; GABLE</text>
  <text x="250" y="390" font-family="'DM Sans', sans-serif" font-weight="500" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="6">ARCHITECTURE &amp; INTERIORS</text>
</svg>